# Isolated local runtime for Phase 7B.4D migration and security verification.
# No hosted Supabase project is linked by this configuration.
project_id = "wuxuai-phase7b4d-local"

[api]
enabled = true
port = 56121
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 56122
shadow_port = 56120
health_timeout = "5m"
major_version = 17

[db.pooler]
enabled = false
port = 56127
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[db.network_restrictions]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 56123
api_url = "http://127.0.0.1:56121"

[local_smtp]
enabled = false
port = 56124

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

[auth]
enabled = true
site_url = "http://127.0.0.1:56126"
additional_redirect_urls = ["http://127.0.0.1:56126"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[edge_runtime]
enabled = false
policy = "per_worker"
inspector_port = 56125
deno_version = 2

[analytics]
enabled = false
port = 56127
backend = "postgres"
